# --- Service Port ---
server.port=8086
spring.application.name=exam-service

# --- MySQL Data Source ---
# Using 'mysql' service name instead of localhost for Docker
spring.datasource.url=jdbc:mysql://mysql:3306/examdb?allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Eureka Discovery Client ---
# Using 'eureka-server' service name instead of localhost
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# --- Actuator and Prometheus ---
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=exam-service

# --- Logging ---
logging.level.org.springframework.web=INFO
logging.level.com.furkan.examservice=DEBUG