global:
  scrape_interval: 10s

scrape_configs:
  - job_name: 'spring-boot-microservices'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'eureka-server:8761'
          - 'api-gateway:8222'
          - 'student-service:8081'
          - 'exam-service:8086'
          - 'course-service:8082'
          - 'enrollment-service:8085'
          - 'notification-service:8084'
          - 'payment-service:8087'
          - 'department-service:8083'
          - 'analytics-service:8088'
          - 'config-server:8888'