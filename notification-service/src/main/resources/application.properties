# --- Service Port ---
server.port=8084
spring.application.name=notification-service

# --- Spring Data MongoDB ---
# Using 'mongo' service name instead of localhost for Docker
spring.data.mongodb.uri=mongodb://mongo:27017/notificationdb

# --- Eureka Discovery Client ---
# Using 'eureka-server' service name instead of localhost
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# --- Actuator and Prometheus ---
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=notification-service

# --- Feign (Spring Boot 3+ for Resilience4j) ---
feign.circuitbreaker.enabled=true

# --- Logging ---
logging.level.org.springframework.web=INFO
logging.level.com.furkan.notificationservice=DEBUG