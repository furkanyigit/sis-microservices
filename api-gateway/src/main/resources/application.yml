server:
  port: 8222

logging:
  level:
    io.github.resilience4j: DEBUG
    org.springframework.cloud.circuitbreaker: DEBUG

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: student-service
          uri: lb://student-service
          predicates:
            - Path=/students/**
          filters:
            - name: CircuitBreaker
              args:
                name: studentCircuit
                fallbackUri: forward:/fallback/student
        # ... (Diğer route tanımların aynı kalabilir, lb:// kullanımı Docker'da Eureka üzerinden çalıştığı için doğrudur) ...
        - id: course-service
          uri: lb://course-service
          predicates:
            - Path=/courses/**
          filters:
            - name: CircuitBreaker
              args:
                name: courseCircuit
                fallbackUri: forward:/fallback/course
        - id: enrollment-service
          uri: lb://enrollment-service
          predicates:
            - Path=/enrollments/**
          filters:
            - name: CircuitBreaker
              args:
                name: enrollmentCircuit
                fallbackUri: forward:/fallback/enrollment
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/notifications/**
          filters:
            - name: CircuitBreaker
              args:
                name: notificationCircuit
                fallbackUri: forward:/fallback/notification
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/payments/**
          filters:
            - name: CircuitBreaker
              args:
                name: paymentCircuit
                fallbackUri: forward:/fallback/payment
        - id: exam-service
          uri: lb://exam-service
          predicates:
            - Path=/exams/**
          filters:
            - name: CircuitBreaker
              args:
                name: examCircuit
                fallbackUri: forward:/fallback/exam
        - id: analytics-service
          uri: lb://analytics-service
          predicates:
            - Path=/analytics/**
          filters:
            - name: CircuitBreaker
              args:
                name: analyticsCircuit
                fallbackUri: forward:/fallback/analytics

# --- EUREKA AYARLARI ---
eureka:
  client:
    service-url:
      # localhost:8761 -> eureka-server:8761 (Docker servis ismi)
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# --- ACTUATOR & PROMETHEUS ---
management:
  endpoints:
    web:
      exposure:
        # İzleme için health, info ve prometheus açık olmalı
        include: health,info,prometheus
  endpoint:
    health:
      # Sigorta durumlarını (Circuit Breaker) Grafana'da görmek için 'always' şart
      show-details: always
  health:
    circuitbreakers:
      enabled: true # Sigorta durumlarını Actuator'e ekler
  metrics:
    tags:
      application: api-gateway

# --- RESILIENCE4J AYARLARI ---
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true # Actuator üzerinden izlenebilirlik sağlar
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
        slowCallDurationThreshold: 500ms
        slowCallRateThreshold: 50
    instances:
      studentCircuit:
        baseConfig: default
      courseCircuit:
        baseConfig: default
      enrollmentCircuit:
        baseConfig: default
      notificationCircuit:
        baseConfig: default
      paymentCircuit:
        baseConfig: default
      analyticsCircuit:
        baseConfig: default
      examCircuit:
        baseConfig: default

  timelimiter:
    configs:
      default:
        timeoutDuration: 20s