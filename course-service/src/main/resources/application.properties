# ===============================
# Server
# ===============================
server.port=8082
spring.application.name=course-service

# ===============================
# MySQL Datasource
# ===============================
# localhost:3306 -> mysql:3306 (Docker servis ismi)
spring.datasource.url=jdbc:mysql://mysql:3306/coursedb?allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Eureka Client
# ===============================
# localhost:8761 -> eureka-server:8761 (Docker servis ismi)
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ===============================
# Actuator & Prometheus
# ===============================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=course-service